<!doctype html>
<html class="dark" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&display=swap"
      rel="stylesheet"
    />
    <link href="./fonts.css" rel="stylesheet" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="bg-gray-200 text-gray-900 dark:bg-gray-900 dark:text-gray-200">
    <header class="bg-white dark:bg-gray-800 shadow-2xl shadow-red-600/15">
      <div class="max-w-300 mx-auto">
        <!-- flex contaner -->
        <div class="flex items-center justify-between px-4">
          <h1 class="text-teal-600 font-bold text-4xl font-hand">
            POS. <span class="text-red-600">Gz</span>
          </h1>
          <nav class="flex items-center gap-4">
            <ul class="flex gap-4 items-center text-lg text-teal-600">
              <li class="hover:text-teal-700 hover:font-bold">
                <a href="#">Home</a>
              </li>
              <li class="hover:text-teal-700 hover:font-bold">
                <a href="#">Products</a>
              </li>
              <li class="hover:text-teal-700 hover:font-bold">
                <a href="#">Services</a>
              </li>
              <li class="hover:text-teal-700 hover:font-bold">
                <a href="#">About us</a>
              </li>
            </ul>
            <button id="toggle-theme" type="button" class="p-2 rounded">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-palette-icon lucide-palette"
              >
                <path
                  d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"
                />
                <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
              </svg>
            </button>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <section
        class="bg-linear-to-tl from-red-500/75 to-blue-500/75 p-6 h-[calc(100vh-80px)] flex items-center justify-center"
      >
        <div class="max-w-300 mx-auto p-4 text-center">
          <h2 class="text-[41px] font-bold mb-4">Welcome to POS.Gz</h2>
          <p class="text-lg mb-6 font-kdam">
            ដោយយល់ឃើញថា ការទទួលស្គាល់សេចក្ដីថ្លៃថ្នូរជាប់ពីកំណើត
            និងសិទ្ធិស្មើភាពគ្នា
          </p>
          <div>
            <button class="btn-primary">Learn More...</button>
          </div>
        </div>
      </section>
      <section>
        <details class="dropdown">
          <summary class="btn m-1">open or close</summary>
          <ul
            class="menu dropdown-content bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm"
          >
            <li><a>Item 1</a></li>
            <li><a>Item 2</a></li>
          </ul>
        </details>
        <button class="btn btn-xs">Xsmall</button>
        <button class="btn btn-sm btn-primary">Small</button>
        <button class="btn">Medium</button>
        <button class="btn btn-lg">Large</button>
        <button class="btn btn-xl">Xlarge</button>
      </section>
      <!-- Feature Products -->
      <section class="max-w-300 mx-auto p-4 mt-6">
        <h2 class="text-2xl text-center text-teal-600 mb-4">
          Feature Products
        </h2>
        <!-- card wrapper  -->
        <div
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-4 gap-2"
        >
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 1
          </div>
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 2
          </div>
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 3
          </div>
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 4
          </div>
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 5
          </div>
          <div class="border p-2 rounded-xl shadow dark:border-gray-700">
            Product 6
          </div>
        </div>
      </section>
    </main>
    <script>
      // get local storage theme
      const theme = localStorage.getItem("theme");
      if (theme === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      const toggleThemeBtn = document.getElementById("toggle-theme");
      toggleThemeBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        if (document.documentElement.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
        } else {
          localStorage.setItem("theme", "light");
        }
      });
    </script>
  </body>
</html>
